<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A3D2A">
<title>Ghana Life</title>
<style>
:root{
  --ink:#16202a; --muted:#6b7683; --green:#4caf75; --green2:#3c9a63; --bg:#eef2f7;
  --gold:#FCD116; --red:#CE1126;
  --font:"Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 6px 24px rgba(20,30,50,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-text-size-adjust:100%;line-height:1.4}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none !important}
button,input,select{font:inherit}
button{cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px}

.stack{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:8px;z-index:5;pointer-events:none}
.stack>*{pointer-events:auto}
.livebar{align-self:center;background:rgba(22,32,42,.85);color:#fff;font-size:13px;font-weight:700;padding:6px 14px;border-radius:99px;box-shadow:0 3px 12px rgba(20,30,50,.25)}
.topbar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.96);border-radius:30px;padding:8px 10px 8px 12px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:8px;font-size:21px;letter-spacing:-.02em;font-weight:800}
.badge-logo{width:34px;height:34px;border-radius:50%;background:#111;color:var(--gold);display:grid;place-items:center;font-size:18px;flex:none}
.grow{flex:1}
.pillbtn{padding:11px 18px;border-radius:99px;background:#eef1f5;font-weight:700}
.pillbtn.green{background:var(--green);color:#fff}
.cashpill{padding:9px 14px;border-radius:99px;background:#eaf7ef;color:#1f6b41;font-weight:800;transition:background .2s}
.cashpill.up{background:#c9f0d8}.cashpill.down{background:#fbd9d6}
.iconbtn{width:40px;height:40px;border-radius:50%;background:#eef1f5;font-size:19px;position:relative;display:grid;place-items:center}
.iconbtn .badge{position:absolute;top:-4px;right:-4px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip2{padding:8px 13px;border-radius:99px;background:rgba(255,255,255,.94);font-size:14px;font-weight:700;box-shadow:0 3px 12px rgba(20,30,50,.12);white-space:nowrap;flex:none}
button.chip2:active{background:#eaf7ef}
.banner{width:100%;background:#3d8b57;color:#fff;font-weight:800;font-size:16px;padding:12px 16px;border-radius:99px;box-shadow:var(--shadow);text-align:center}
.statpill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);border-radius:99px;padding:8px 14px;box-shadow:0 3px 12px rgba(20,30,50,.12);font-size:13px;font-weight:700}
.mini-m{display:flex;align-items:center;gap:5px;flex:1}
.mini-m .bar{flex:1}
.bar{height:7px;background:#dfe5ec;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.role{white-space:nowrap;color:var(--muted);font-weight:600}
#mini{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 232px);width:110px;height:67px;border-radius:12px;box-shadow:var(--shadow);z-index:4;pointer-events:none}
.toast{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 168px);background:rgba(22,32,42,.88);color:#fff;border-radius:16px;padding:10px 14px;font-size:14px;font-weight:600;z-index:4;box-shadow:var(--shadow)}
.ctl{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;z-index:5;pointer-events:none;user-select:none;-webkit-user-select:none}
.ctl>*{pointer-events:auto}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px;grid-template-areas:". up ." "left down right"}
.d{background:rgba(255,255,255,.88);border-radius:16px;font-size:20px;touch-action:none;color:var(--ink);box-shadow:0 3px 12px rgba(20,30,50,.18)}
.d:active,.d.held{background:var(--green);color:#fff}
.d.up{grid-area:up}.d.left{grid-area:left}.d.down{grid-area:down}.d.right{grid-area:right}
.rightcol{display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:58%}
.actbtn{min-width:150px;background:var(--green);color:#fff;font-weight:800;font-size:17px;border-radius:20px;padding:16px 20px;box-shadow:var(--shadow)}
.actbtn.idle{background:rgba(255,255,255,.88);color:var(--muted);font-weight:700;font-size:14px}
.taxibtn{background:rgba(255,255,255,.92);border-radius:99px;padding:10px 16px;font-weight:800;box-shadow:0 3px 12px rgba(20,30,50,.18)}

/* landing */
.bottomcard{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:rgba(255,255,255,.97);border-radius:30px;padding:18px 18px 14px;box-shadow:var(--shadow);z-index:5}
.avrow{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:15px;color:var(--muted)}
.avrow b{color:var(--ink)}
.avs{display:flex}
.avs canvas{width:44px;height:44px;border-radius:50%;border:3px solid #fff;margin-left:-10px;background:#dfe9f2}
.avs canvas:first-child{margin-left:0}
.btnrow{display:flex;gap:10px}
.bigbtn{flex:1;background:var(--green);color:#fff;font-weight:800;font-size:20px;padding:18px;border-radius:99px;box-shadow:0 8px 20px rgba(76,175,117,.4)}
.ghostbtn{padding:18px 26px;border-radius:99px;background:#fff;border:1.5px solid #e1e7ee;font-weight:800;font-size:18px}
.linkrow{display:flex;justify-content:center;gap:16px;margin-top:10px;flex-wrap:wrap}
.linkbtn{color:var(--muted);font-weight:700;font-size:14px;text-decoration:underline;padding:4px}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;color:var(--ink);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:26px 18px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:90vh;overflow:auto;position:relative}
.sheet::before{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;margin-left:-22px;border-radius:9px;background:#d5dbe3}
.sheet h2{font-weight:800;font-size:23px;letter-spacing:-.02em;margin:6px 0 6px}
.sheet p{margin-bottom:12px;font-size:15px}
.small{font-size:13px;color:var(--muted)}
.choices{display:grid;gap:8px;margin-top:6px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{background:#fff;color:var(--ink);text-align:left;padding:14px 16px;border-radius:16px;font-weight:700;border:1.5px solid #dfe5ec}
.choices.two .choice{padding:11px 12px;font-size:13px}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice:active:not(:disabled){background:#eaf7ef}
.choice.gold{background:var(--green);color:#fff;border-color:var(--green);text-align:center}
.txt,select.txt{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid #dfe5ec;background:#f7f9fb;color:var(--ink);margin-bottom:8px}
.field-label{font-weight:700;font-size:14px;display:block;margin:10px 0 6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px #0003}
.sw.on{border-color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px;border-radius:14px;background:#f1f4f8;font-weight:700;border:1.5px solid transparent}
.seg button.on{background:var(--ink);color:#fff}
.res{display:grid;grid-template-columns:110px 1fr 42px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.res .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .b{height:12px;background:#e3e8ee;border-radius:99px;overflow:hidden}
.res .b i{display:block;height:100%;background:var(--green)}
.res.you .b i{background:var(--red)}
.res.lead .b i{background:var(--green)}
.res .pc{text-align:right;font-weight:800}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:15px;margin-bottom:12px}
.kv b{text-align:right}
.mapwrap{background:#dcebe0;border-radius:14px;margin:8px 0}
.mapwrap svg{display:block;width:100%;height:auto}
.dot{cursor:pointer}
.info{background:#f4f7fa;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px}
.bundles{display:grid;gap:8px}
.bundle{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1.5px solid #dfe5ec;border-radius:16px;padding:13px 14px;font-weight:800;text-align:left}
.bundle span{font-weight:600;font-size:13px;display:block;color:var(--muted)}
.bundle em{font-style:normal;background:var(--green);color:#fff;padding:7px 12px;border-radius:99px}
.notice{background:#fff6d6;border-radius:12px;padding:9px 11px;font-size:13px;margin:8px 0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;font-size:20px;font-weight:800}
.stepper b{min-width:60px;text-align:center;font-size:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:800;text-align:center}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto;margin:8px 0;padding:8px;background:#eef2f6;border-radius:14px}
.msg{max-width:80%;padding:8px 11px;border-radius:14px;font-size:14px;background:#fff;align-self:flex-start;word-break:break-word}
.msg.me{align-self:flex-end;background:#d8f3e2}
.chatrow{display:flex;gap:8px}
.chatrow input{flex:1;margin-bottom:0}
.chatrow button{padding:0 18px;border-radius:14px;background:var(--green);color:#fff;font-weight:800}
.person{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1.5px solid #dfe5ec;border-radius:16px;padding:10px 12px;margin:6px 0;font-size:14px}
.person b{display:block}
.person button{padding:9px 14px;border-radius:99px;background:var(--green);font-weight:800;color:#fff;white-space:nowrap}
.dotg{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2e9e5b;margin-right:6px}
.dotx{background:#9aa5a0}
.sheet .tabs{margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <canvas id="mini" width="220" height="134" hidden></canvas>

  <section id="landing">
    <div class="stack">
      <div class="livebar" id="liveL" hidden></div>
      <div class="topbar">
        <div class="brand"><span class="badge-logo">★</span>Ghana Life</div><div class="grow"></div>
        <button class="pillbtn green" id="lSignup">Sign up</button><button class="pillbtn" id="lLogin">Log in</button>
      </div>
      <div class="chips" id="lChips"></div>
      <div class="banner" id="lBanner"></div>
    </div>
    <div class="bottomcard">
      <div class="avrow"><div class="avs" id="lAv"></div><span id="lPlaying">Free to play in your browser</span></div>
      <div class="btnrow"><button class="bigbtn" id="lMain">Play free</button><button class="ghostbtn" id="lSecond">Log in</button></div>
      <div class="linkrow"><button class="linkbtn" id="lOffline">Play offline</button><button class="linkbtn" id="lAd">Businesses: advertise here</button></div>
    </div>
  </section>

  <section id="game" hidden>
    <div class="stack">
      <div class="livebar" id="liveG" hidden></div>
      <div class="topbar">
        <div class="brand"><span class="badge-logo">★</span>Ghana Life</div><div class="grow"></div>
        <div class="cashpill" id="cashPill">₵0</div>
        <button class="iconbtn" id="phoneBtn" aria-label="Phone">📱</button>
      </div>
      <div id="hud" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div class="toast" id="log" hidden></div>
    <div class="ctl">
      <div class="dpad">
        <button class="d up" data-dir="up" aria-label="Move up">▲</button>
        <button class="d left" data-dir="left" aria-label="Move left">◀</button>
        <button class="d down" data-dir="down" aria-label="Move down">▼</button>
        <button class="d right" data-dir="right" aria-label="Move right">▶</button>
      </div>
      <div class="rightcol">
        <button class="taxibtn" id="taxiBtn">🚕 Taxi</button>
        <button class="actbtn idle" id="actBtn">Walk to a building</button>
      </div>
    </div>
  </section>

  <div class="overlay" id="modal" hidden role="dialog" aria-modal="true">
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   CONFIG: fill these in to take REAL payments (see ghana-life-server.js)
   - PAYSTACK_PUBLIC_KEY: your Paystack PUBLIC key (pk_test_... or pk_live_...)
   - BACKEND_URL: where you host ghana-life-server.js, no trailing slash
   While either is empty the game runs in DEMO mode: no real money moves.
   NEVER put your secret key (sk_...) in this file.
   ===================================================================== */
const CONFIG = {
  PAYSTACK_PUBLIC_KEY: "pk_live_a33d5bd9b2ba796813c30ca8562d0cd0e161b168",   // public key: safe to keep in this file

  ALLOW_DEMO_PAYMENTS: false,  // demo purchases only work when no Paystack key is set

};
const BUNDLES = [
  { id: "starter",  name: "Starter",   ghs: 10,  cedis: 1000 },

];

const SAVE_KEY = "ghanalife_save_v2", ADS_KEY = "ghanalife_ads_v1";
const $ = id => document.getElementById(id);
const rnd = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const fmt = n => "₵" + Math.round(n).toLocaleString("en-US");
const ghs = n => "GH₵" + Number(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NS = "http://www.w3.org/2000/svg";
const DAYN = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

/* ---------------- Data ---------------- */
const REGIONS = [
{n:"Ahafo",cap:"Goaso",b:"forest",pop:1.9,lat:6.80,lon:-2.52,jobs:[["Cocoa farm hand",35,60,"You carried cocoa pods all morning."],["Sell plantain at the market",30,95,"You sold plantain by the bunch."]]},
{n:"Ashanti",cap:"Kumasi",b:"forest",pop:17.6,lat:6.69,lon:-1.62,jobs:[["Load goods at Kejetia",45,75,"You hauled goods through Kejetia."],["Trade kente cloth at Adum",40,140,"You moved kente to a visiting buyer."]]},
{n:"Bono",cap:"Sunyani",b:"forest",pop:3.9,lat:7.34,lon:-2.33,jobs:[["Harvest cashew",38,65,"You picked cashew apples in the heat."],["Sell cashew nuts",35,100,"You sold bags of roasted cashew."]]},

{n:"Greater Accra",cap:"Accra",b:"coast",pop:17.7,lat:5.60,lon:-0.19,jobs:[["Trotro mate at Circle",45,80,"You called out stops all day at Circle."],["Run a mobile money kiosk",50,150,"You processed MoMo transfers non-stop."]]},

];
const POPSUM = REGIONS.reduce((s, r) => s + r.pop, 0);
const SKINS = ["#f0c9a0", "#c68642", "#a56a3a", "#8d5524", "#6f4320", "#4a2c17"];
const OUTFITS = ["#CE1126", "#FCD116", "#006B3F", "#1e5fbf", "#7b2d8e", "#222222"];

const PARTIES = ["Black Star Union", "People's Progress Front"];
const RIVALS = ["Kofi Mensah", "Efua Tetteh", "Abena Owusu", "Yaw Darko", "Kojo Appiah", "Akosua Danso", "Kwesi Antwi", "Ama Boakye", "Nii Lamptey", "Selorm Agbeko", "Fatima Alhassan", "Issah Yakubu"];

/* Landmark kinds: l=label, c=body, r=roof, m=minimap colour */
const KINDS = {

  party: { l: "Party office", c: "#6e7396", r: "#222222", m: "#b0b0b0" },
  mall: { l: "Mall", c: "#5aa3c9", r: "#1e5a7a", m: "#38bdf8" },
  cardealer: { l: "Car dealer", c: "#b34040", r: "#222222", m: "#f87171" },
  hotel: { l: "Hotel", c: "#7d86c9", r: "#2d3375", m: "#818cf8" },
  realty: { l: "Estate agent", c: "#3a9a8f", r: "#0f5a52", m: "#2dd4bf" },
  billboard: { l: "Billboard", c: "#444444", r: "#444444", m: "#FCD116" },

/* ---------------- Sheets (modal queue) ---------------- */
let sheetOpen = false; const sheetQ = [];
function clearInput() { Object.keys(keys).forEach(k => { keys[k] = false; }); Object.keys(joy).forEach(k => { joy[k] = 0; }); document.querySelectorAll(".d").forEach(b => b.classList.remove("held")); }
function showSheet(fn) { sheetQ.push(fn); if (!sheetOpen) nextSheet(); }
function nextSheet() {
  const fn = sheetQ.shift();
  if (!fn) { sheetOpen = false; $("modal").hidden = true; if (S) S.busy = false; return; }
  sheetOpen = true; if (S) S.busy = true; clearInput();
  const el = $("sheet"); el.innerHTML = ""; $("modal").hidden = false;
  fn(el, nextSheet); el.scrollTop = 0;
}
function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function ask(title, body, choices, done) {
  if (ASKFILTER) { const re = ASKFILTER; choices = choices.filter(c => c.label === "Leave" || re.test(c.label)); }
  showSheet((el, close) => {
    el.append(mk("h2", "", title), mk("p", "", body));
    const box = mk("div", "choices"); el.append(box);
    let first = null;
    choices.forEach(c => {
      const b = mk("button", "choice", c.label);
      const why = c.lock || (c.need && S.cash < c.need ? "not enough cash" : "");
      if (why) { b.disabled = true; b.textContent += " (" + why + ")"; }
      b.onclick = () => {
        const msg = c.fn ? c.fn() : "";
        if (INSIDE) { INSIDE.spec = buildSpec(INSIDE.b); unstick(); }
        say(msg); clampAll(); close(); render();
        if (c.time) afterTimed(c.slots || 1);
        if (c.after) c.after();
        if (done) done();
      };
      box.append(b);
      if (!first && !b.disabled) first = b;
    });
    if (first) first.focus();
  });
}
function infoSheet(title, build) {
  showSheet((el, close) => {

}
function resultSheet(title, body, rows, extra) {

/* ---------------- Time flow ---------------- */
function afterTimed(n) {
  clampAll();
  if (S.hunger >= 100) { S.cash = Math.max(0, S.cash - 50); S.hunger = 55; S.energy = clamp(S.energy - 20); say("You nearly fainted from hunger. The clinic cost ₵50."); }
  save(); render();
  if (Math.random() < 0.3) { const ev = pickEvent(); ask(ev.title, ev.body, ev.choices, () => advance(n)); }
  else advance(n);
}
function advance(n) { for (let i = 0; i < n; i++) { S.slot++; if (S.slot >= 3) endDay(); } render(); save(); }
function endDay() {
  S.hunger += 10; S.energy += 55; S.slot = 0; S.day++; clampAll();
  say(DAYN[wd()] + ", day " + S.day + " begins.");
  S.pending = S.pending.filter(p => { if (S.day >= p.day) { S.cash += p.amount; say(p.msg); return false; } return true; });
  if ((S.day - 1) % 7 === 0) weekly();
  if (S.race) { drift(); if (S.day >= S.race.electionDay) resolveElection(); }
  checkFbi();
}
function weekly() {
  const L = S.home.level;
  if (L === 0) {
    const rent = Math.round(150 * (lawOn("rent") ? 0.5 : 1));
    if (S.cash >= rent) { S.cash -= rent; say("Weekly rent and bills: " + fmt(rent) + "."); }
    else { say("You could only pay " + fmt(S.cash) + " of the rent. Your reputation took a hit."); S.cash = 0; S.rep -= 5; }
  } else { const bills = Math.round(40 * L * (lawOn("rent") ? 0.5 : 1)); S.cash = Math.max(0, S.cash - bills); say("Home maintenance and bills: " + fmt(bills) + "."); S.rep += L * 0.5; }
  if (S.role === "mp") { S.cash += 1500; addInc("salary", 1500); say("MP salary paid: ₵1,500."); }
  if (S.role === "president") { S.cash += 8000; addInc("salary", 8000); say("Presidential salary paid: ₵8,000."); }
  let inc = 0;
  Object.values(S.props).forEach(p => { if (p.type === "plot") p.value = Math.round(p.value * 1.03); else inc += p.value * PROPS[p.type].rate * (0.85 + Math.random() * 0.3) * furnRent(p); });
  if (inc) { inc = Math.round(inc); S.cash += inc; addInc("rent", inc); say("Your properties earned " + fmt(inc) + " in rent this week."); }
  S.rep += styleF(S.home.furn) * 0.3;
  { const nl = LAWS[rnd(0, LAWS.length - 1)]; S.law = nl.id; say("New law this week: " + nl.t + "."); }
  clampAll();
}

function drawFlight(t) {

const FBI_TIERS = [50000, 200000, 800000, 3000000];
function checkFbi() {
  if (S.fbi) { if (S.day > S.fbi.dueDay) { const fine = Math.round(S.cash * 0.1); S.cash -= fine; S.rep -= 10; S.fbi = null; say("You ignored the FBI invitation. They fined you " + fmt(fine) + " and your reputation dropped."); } return; }
  const t = S.fbiTier || 0;
  if (t < FBI_TIERS.length && netWorth() >= FBI_TIERS[t]) {
    S.fbi = { tier: t, dueDay: S.day + 3 }; S.fbiTier = t + 1;
    ask("🕵️ FBI invitation", "Agents have noticed " + fmt(netWorth()) + " in your name. They invite you to their office to explain how you got it. Visit any FBI office within 3 days.", [{ label: "I will go and explain" }, { label: "Ignore it for now" }]);
  }
}
function fbiDesk() { ask("FBI front desk", S.fbi ? "Agent: We have been expecting you. Go to the interview room. You must come by day " + S.fbi.dueDay + "." : "Agent: Nothing on your file. Keep your records clean.", [{ label: "OK" }]); }
function fbiResult(title, text, rows, total) {
  showSheet((el, close) => {
    el.append(mk("h2", "", title), mk("p", "", text), mk("p", "small", "What the records showed:"));
    rows.forEach(([l, v]) => { const pct = Math.round(v / total * 100), d = mk("div", "res"), bar = mk("div", "b"), i = document.createElement("i"); i.style.width = pct + "%"; bar.append(i); d.append(mk("span", "nm", l), bar, mk("span", "pc", pct + "%")); el.append(d); });
    const b = mk("button", "choice gold", "Continue"); b.onclick = () => { close(); afterTimed(1); }; el.append(b);
  });
}
function fbiInterview() {
  if (!S.fbi) return fbiDesk();
  const inc = S.inc || {}, w = netWorth(), start = S.startCash || 200;
  const labour = inc.labour || 0, trade = inc.trade || 0, rent = inc.rent || 0, salary = inc.salary || 0, purchase = inc.purchase || 0, known = labour + trade + rent + salary + purchase;
  const other = Math.max(0, w - start - known), total = Math.max(1, known + other), sh = x => x / total;
  const rows = [["Jobs", labour], ["Trading", trade], ["Property rent", rent], ["Public salary", salary], ["Wallet top-ups", purchase], ["Other", other]];
  const claims = [
    { t: "I earned it through jobs and trading", ok: sh(labour + trade) >= 0.35 }, { t: "It comes from my property rent", ok: sh(rent) >= 0.25 },
    { t: "It is my salary as a public official", ok: sh(salary) >= 0.25 }, { t: "Investments, land growth and gifts", ok: sh(other) >= 0.3 }, { t: "I topped up my wallet with savings", ok: sh(purchase) >= 0.25 }];
  showSheet((el, close) => {
    el.append(mk("h2", "", "FBI interview"), mk("p", "", "Agent: " + S.name + ", you hold " + fmt(w) + ". Explain how you got this money. We will compare your answer with the records."));
    const ta = mk("textarea", "txt"); ta.placeholder = "Your statement (optional): tell the agent your story"; ta.maxLength = 300; ta.rows = 3; el.append(ta);
    const box = mk("div", "choices"); el.append(box);
    const done = () => { S.statements = (S.statements || []).concat([{ day: S.day, text: ta.value.trim().slice(0, 300) }]).slice(-5); S.fbi = null; clampAll(); close(); render(); };
    claims.forEach(cl => { const b = mk("button", "choice", cl.t); b.onclick = () => {
      if (cl.ok) { S.rep += 6; say("The FBI cleared you. Case closed."); done(); fbiResult("Case closed", "Agent: Your story matches the records. You are free to go. Thank you for coming in.", rows, total); }
      else { const fine = Math.round(S.cash * 0.2); S.cash -= fine; S.rep -= 15; say("The FBI caught a lie. Fine: " + fmt(fine) + "."); done(); fbiResult("Your story does not match", "Agent: Our records show something different. You are fined " + fmt(fine) + " and your reputation takes a hit.", rows, total); } }; box.append(b); });
    const sil = mk("button", "choice", "I would rather not say"); sil.onclick = () => { const fine = Math.round(S.cash * 0.08); S.cash -= fine; S.rep -= 5; say("You stayed silent. Fine: " + fmt(fine) + "."); done(); fbiResult("You stayed silent", "Agent: Silence does not help you. You are fined " + fmt(fine) + ", but we will let you go this time.", rows, total); }; box.append(sil);
    const cost = Math.round(S.cash * 0.15), br = mk("button", "choice", "Offer the agent a bribe (" + fmt(cost) + ")"); if (cost < 1) br.disabled = true;
    br.onclick = () => { if (Math.random() < 0.45) { S.cash -= cost; S.rep -= 3; say("The agent took the bribe. Case dropped."); done(); fbiResult("Case dropped", "Agent: I did not see anything. Do not come back.", rows, total); } else { const fine = Math.round(S.cash * 0.3); S.cash -= fine + cost; S.rep -= 25; say("Bribery attempt failed. Fine: " + fmt(fine + cost) + "."); done(); fbiResult("Bribery attempt", "Agent: Did you just try to bribe a federal agent? You are fined " + fmt(fine + cost) + ".", rows, total); } }; box.append(br);
    const cl = mk("button", "choice", "Come back later"); cl.onclick = close; el.append(cl);
  });
}
function fbiMenu() { fbiDesk(); }
